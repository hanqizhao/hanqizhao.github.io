<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const faviconCandidates = [
          "/site-icons/favicon.svg",
          "/site-icons/favicon.png",
          "/site-icons/favicon.ico",
        ];

        const applyFavicon = (href, type) => {
          const link = document.createElement("link");
          link.rel = "icon";
          link.href = href;
          if (type) {
            link.type = type;
          }
          document.head.appendChild(link);
        };

        const probeFavicon = async () => {
          for (const href of faviconCandidates) {
            try {
              const response = await fetch(href, { method: "HEAD", cache: "no-cache" });
              if (response.ok) {
                applyFavicon(href, response.headers.get("content-type") || "");
                return;
              }
            } catch {
              // Ignore missing optional favicon candidates.
            }
          }
        };

        void probeFavicon();
      })();
    </script>
